apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdma-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rdma-client
  template:
    metadata:
      labels:
        app: rdma-client
    spec:
      containers:
        - name: client
          image: docker.io/library/busybox:1.36.1
          command: ["sh", "-c", "sleep 3600"]
