site_name: NVIDIA Kubernetes Launch Kit
site_description: Documentation for deploying NVIDIA cloud-native networking on Kubernetes with l8k
site_url: https://nvidia.github.io/k8s-launch-kit/
repo_name: NVIDIA/k8s-launch-kit
repo_url: https://github.com/NVIDIA/k8s-launch-kit
edit_uri: edit/main/docs/
exclude_docs: |
  *.rst

theme:
  name: material
  language: en
  logo: assets/nvidia-logo.svg
  favicon: assets/nvidia-mark.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.action.edit
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: nvidia
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/styles.css

copyright: Copyright &copy; 2026 NVIDIA Corporation

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Overview:
      - Introduction: index.md
  - User Guide:
      - Installation: user/installation.md
      - Quick Start: user/quick-start.md
      - Deployment Profiles: user/profiles.md
      - Spectrum-X: user/spectrum-x.md
      - Validation: user/validation.md
      - Cleanup: user/cleanup.md
      - Troubleshooting: user/troubleshooting.md
  - Advanced:
      - Concepts: advanced/concepts.md
      - Cluster Discovery: user/discovery.md
      - Manifest Generation: advanced/generation.md
      - Deployment Mechanics: advanced/deployment.md
      - Heterogeneous Clusters: user/heterogeneous-clusters.md
      - Topology Presets: user/presets.md
      - Maintenance and Upgrades: user/maintenance.md
      - Configuration File: reference/configuration.md
  - Integrator Guide:
      - Automation: integrator/automation.md
      - AI Skills: integrator/ai-skills.md
  - Reference:
      - CLI Reference: reference/cli.md
      - Documentation Publishing: reference/docs-publishing.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
