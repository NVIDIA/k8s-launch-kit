site_name: NVIDIA Kubernetes Launch Kit
site_description: Documentation for deploying NVIDIA cloud-native networking on Kubernetes with l8k
site_url: https://nvidia.github.io/k8s-launch-kit/
repo_name: NVIDIA/k8s-launch-kit
repo_url: https://github.com/NVIDIA/k8s-launch-kit
edit_uri: edit/main/docs/
exclude_docs: |
  *.rst
not_in_nav: |
  /architecture/dpf-integration-plan.md
  /architecture/host-target-migration-plan.md

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/nvidia-logo.svg
  favicon: assets/nvidia-mark.svg
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - content.action.edit
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: nvidia
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - assets/styles.css

copyright: Copyright &copy; 2026 NVIDIA Corporation

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Start:
      - Overview: index.md
      - Plan your deployment: user/profiles.md
      - Install Launch Kit: user/installation.md
      - 'First deployment: SR-IOV Ethernet': user/quick-start.md
      - Networking concepts: advanced/concepts.md
  - Deploy:
      - Discover cluster hardware: user/discovery.md
      - Generate and review manifests: advanced/generation.md
      - Deploy manifests: advanced/deployment.md
      - Deploy on OpenShift: user/openshift.md
      - Deploy Spectrum-X networking: user/spectrum-x.md
      - Deploy to mixed hardware: user/heterogeneous-clusters.md
      - Use topology presets: user/presets.md
      - Use the network in an application: user/workloads.md
  - Operate:
      - Validate and accept a deployment: user/validation.md
      - Change and upgrade a deployment: user/maintenance.md
      - Troubleshoot and collect evidence: user/troubleshooting.md
      - Remove a deployment: user/cleanup.md
  - Automate:
      - CI/CD and GitOps: integrator/automation.md
      - Use AI agent skills: integrator/ai-skills.md
  - Reference:
      - CLI reference: reference/cli.md
      - Configuration reference: reference/configuration.md
  - Contribute:
      - Architecture: architecture/overview.md
      - Artifact bundle internals: architecture/artifact-bundle.md
      - Extend deployment targets: advanced/targets.md
      - Maintain and publish documentation: reference/docs-publishing.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
