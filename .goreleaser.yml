version: 2

project_name: l8k

builds:
  - main: .
    binary: l8k
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags: |
      -w -s
      -extldflags "-static"
      -X github.com/nvidia/k8s-launch-kit/pkg/cmd.Version={{ .Tag }}
      -X github.com/nvidia/k8s-launch-kit/pkg/cmd.GitCommit={{ .ShortCommit }}
      -X github.com/nvidia/k8s-launch-kit/pkg/cmd.BuildDate={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

gomod:
  proxy: false

sboms:
  - artifacts: binary

archives:
  - format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - profiles/**/*
      - presets/**/*
      - l8k-config.yaml
      - LICENSE
    name_template: "l8k_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

report_sizes: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

release:
  mode: append

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^build:"
      - "^docs:"
      - "^test:"
      - "^lint:"
      - "^chore:"
  groups:
    - title: "New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?(fix|bug)(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Other Changes"
      order: 999

brews:
  - name: l8k
    repository:
      owner: nvidia
      name: k8s-launch-kit
      git:
        url: "ssh://git@github.com/nvidia/k8s-launch-kit.git"
        private_key: '{{ index .Env "HOMEBREW_DEPLOY_KEY" }}'
    skip_upload: '{{ if index .Env "HOMEBREW_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    commit_author:
      name: github-actions
      email: github-actions@github.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/nvidia/k8s-launch-kit"
    description: "CLI for deploying NVIDIA cloud-native networking on Kubernetes"
    license: "Apache-2.0"
    install: |
      bin.install "l8k"
      (share/"l8k").install "profiles"
      (share/"l8k").install "presets"
      (share/"l8k").install "l8k-config.yaml"
    test: |
      assert_match version.to_s, shell_output("#{bin}/l8k version")
