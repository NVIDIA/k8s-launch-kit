name: Recreate latest release

on:
  workflow_dispatch:

concurrency:
  group: recreate-latest-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  recreate:
    name: Recreate latest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Recreate release and tag
        id: release
        run: |
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest")"
          release_id="$(jq -er '.id' <<< "$release")"
          tag="$(jq -er '.tag_name | select(length > 0)' <<< "$release")"
          name="$(jq -r '.name // .tag_name' <<< "$release")"
          encoded_tag="$(jq -rn --arg tag "$tag" '$tag | @uri')"

          if jq -e '.immutable == true' <<< "$release" >/dev/null; then
            echo "::error::The latest release is immutable and cannot be recreated"
            exit 1
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}" >/dev/null

          {
            echo "Recreating release: $name"
            echo "Tag: $tag"
            echo "Target commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${encoded_tag}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$name" \
            --target "$GITHUB_SHA" \
            --latest \
            --generate-notes

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Dispatch release artifacts
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # GITHUB_TOKEN events do not trigger the release/tag workflows.
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"
          gh workflow run image-push-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"
