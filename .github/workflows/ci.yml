name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: Mellanox/cloud-orchestration-reusable-workflows/.github/workflows/go-ci-reusable.yml@main
    with:
      timeout-minutes: 60
      build-command: |
        make build
        python3 scripts/check-docs.py --binary build/l8k
        make build-all
      test-command: ''

  tests:
    name: Test (${{ matrix.lane }})
    strategy:
      fail-fast: false
      matrix:
        lane: [packages, deployment-1, deployment-2, deployment-3, deployment-4, deployment-5]
    uses: Mellanox/cloud-orchestration-reusable-workflows/.github/workflows/go-check-reusable.yml@main
    with:
      timeout-minutes: 60
      command: bash scripts/test-ci.sh ${{ strategy.job-index }} ${{ strategy.job-total }}

  test-gate:
    name: Complete test suite
    if: ${{ always() }}
    needs: [ci, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test lane
        env:
          L8K_CI_RESULT: ${{ needs.ci.result }}
          L8K_TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$L8K_CI_RESULT" = success
          test "$L8K_TEST_RESULT" = success
