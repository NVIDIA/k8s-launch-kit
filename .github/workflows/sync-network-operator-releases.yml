name: Sync Network Operator releases

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pkg/networkoperatorplugin/releases/releases.yaml"

concurrency:
  group: sync-network-operator-releases
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    name: Sync release catalog
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      catalog_changed: ${{ steps.changes.outputs.changed }}
      release_ref: ${{ steps.merge.outputs.sha || github.sha }}
      release_tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Sync release catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make sync-network-operator-releases

      - name: Read latest catalog tag
        id: release
        run: |
          tag="$(go run ./hack/sync-network-operator-releases \
            --print-latest-tag)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- pkg/networkoperatorplugin/releases/releases.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify synchronized catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          make build
          go test -race -count=1 ./...

      - name: Create and merge pull request
        if: steps.changes.outputs.changed == 'true'
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="automation/network-operator-release-sync"
          remote_sha=""
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            remote_sha="$(git rev-parse "refs/remotes/origin/${branch}")"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -- pkg/networkoperatorplugin/releases/releases.yaml
          git commit -s -m "chore: sync Network Operator release versions"

          if [ -n "$remote_sha" ]; then
            git push \
              --force-with-lease="refs/heads/${branch}:${remote_sha}" \
              origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi

          body="Automated nightly synchronization from Mellanox/network-operator release branches.

          The newest catalog release falls back to master only while its release branch is absent.

          Source workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="chore: sync Network Operator release versions"
          pr_number="$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open \
            -f head="${GITHUB_REPOSITORY_OWNER}:${branch}" \
            -f base=main \
            --jq '.[0].number')"

          if [ -n "$pr_number" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              -f title="$title" \
              -f body="$body" >/dev/null
          else
            pr_number="$(gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/pulls" \
              -f head="$branch" \
              -f base=main \
              -f title="$title" \
              -f body="$body" \
              --jq '.number')"
          fi

          mergeable=""
          for _ in {1..15}; do
            mergeable="$(gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
              --jq '.mergeable')"
            if [ "$mergeable" != "null" ]; then
              break
            fi
            sleep 2
          done
          if [ "$mergeable" != "true" ]; then
            echo "::error::PR #${pr_number} is not mergeable"
            exit 1
          fi

          merge_message="Automated nightly synchronization from Mellanox/network-operator release branches.

          Signed-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          merge_result="$(gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
            -f merge_method=squash \
            -f commit_title="${title} (#${pr_number})" \
            -f commit_message="$merge_message" \
            --jq '[.merged, .sha] | @tsv')"
          IFS=$'\t' read -r merged merged_sha <<< "$merge_result"
          if [ "$merged" != "true" ]; then
            echo "::error::PR #${pr_number} was not merged"
            exit 1
          fi

          echo "sha=$merged_sha" >> "$GITHUB_OUTPUT"
          git push origin --delete "$branch"

  release:
    name: Release if needed
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.sync.outputs.release_ref }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify merged catalog is current
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          make sync-network-operator-releases
          if ! git diff --quiet -- \
            pkg/networkoperatorplugin/releases/releases.yaml; then
            echo "::error::Merged release catalog is not synchronized"
            exit 1
          fi

      - name: Check upstream and publication state
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.sync.outputs.release_tag }}
        run: |
          if ! git ls-remote --exit-code --tags \
            https://github.com/Mellanox/network-operator.git \
            "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "The upstream tag ${RELEASE_TAG} does not exist; skipping"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tag_sha="$(git ls-remote --tags origin \
            "refs/tags/${RELEASE_TAG}" | cut -f1)"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -z "$tag_sha" ]; then
              echo "::error::Release ${RELEASE_TAG} exists without a matching tag"
              exit 1
            fi
            echo "Release ${RELEASE_TAG} already exists; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$tag_sha" ]; then
            catalog="pkg/networkoperatorplugin/releases/releases.yaml"
            tagged_catalog_tag="$(git show "${RELEASE_TAG}:${catalog}" |
              go run ./hack/sync-network-operator-releases \
                --catalog - \
                --print-latest-tag)"
            if [ "$tagged_catalog_tag" != "$RELEASE_TAG" ]; then
              echo "::error::Tag ${RELEASE_TAG} does not contain its synchronized catalog version"
              exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish release and dispatch artifacts
        if: steps.publication.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.sync.outputs.release_tag }}
          RELEASE_TARGET: ${{ needs.sync.outputs.release_ref }}
          TAG_EXISTS: ${{ steps.publication.outputs.tag_exists }}
        run: |
          release_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --generate-notes
            --title "$RELEASE_TAG"
          )
          if [ "$TAG_EXISTS" = "true" ]; then
            release_args+=(--verify-tag)
          else
            release_args+=(--target "$RELEASE_TARGET")
          fi
          gh release create "${release_args[@]}"

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"
          gh workflow run image-push-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$RELEASE_TAG"
