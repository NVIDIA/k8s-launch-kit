apiVersion: v1
kind: ConfigMap
metadata:
  name: "hbn-tenant-keepalived"
data:
  keepalived.conf.tmpl: |
    vrrp_script chk-control-plane {
      script "/usr/bin/curl -k https://NODE_IP:NODE_PORT"
      interval 2
      rise 3
      fall 2
      weight 0
    }

    vrrp_instance dpu-cluster-control-plane {
        state BACKUP
        interface INTERFACE
        virtual_router_id VIRTUAL_ROUTER_ID
        priority PRIORITY

        virtual_ipaddress {
           VIRTUAL_IP
        }

        track_script {
            chk-control-plane
        }
    }

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: "hbn-tenant-keepalived"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: "hbn-tenant-keepalived"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "hbn-tenant-keepalived"
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      hostNetwork: true
      initContainers:
      - name: create-conf
        image: alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - |
          #! /bin/sh
          PRIORITY=$(echo ${NODE_IP} | cut -d. -f4)
          sed "s/INTERFACE/${INTERFACE}/g; s/VIRTUAL_ROUTER_ID/${VIRTUAL_ROUTER_ID}/g; s/PRIORITY/${PRIORITY}/g; s/NODE_PORT/${NODE_PORT}/g; s/VIRTUAL_IP/${VIRTUAL_IP}/g; s/NODE_IP/${NODE_IP}/g" /conf-template/keepalived.conf.tmpl > /conf/keepalived.conf
        env:
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: INTERFACE
          value: "eth0"
        - name: VIRTUAL_ROUTER_ID
          value: "126"
        - name: NODE_PORT
          value: "30538"
        - name: VIRTUAL_IP
          value: "192.0.2.20"
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 5m
            memory: 64Mi
        volumeMounts:
        - mountPath: /conf-template
          name: conf-template
          readOnly: true
        - mountPath: /conf
          name: conf
      containers:
      - name: keepalived
        image: example.invalid/keepalived:v26.8.0
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 5m
            memory: 64Mi
        securityContext:
          privileged: true
          capabilities:
            drop: ["ALL"]
            add:
              - NET_ADMIN
              - NET_RAW
              - NET_BROADCAST
        volumeMounts:
        - mountPath: /usr/local/etc/keepalived
          name: conf
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
      volumes:
      - name: conf
        emptyDir:
          sizeLimit: 50Mi
      - configMap:
          defaultMode: 420
          name: "hbn-tenant-keepalived"
        name: conf-template