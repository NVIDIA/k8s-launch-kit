{{- $metaPlugins := secondaryNetworkMetaPlugins .Profile -}}
{{if .Profile.Multirail}}
{{- /* Create separate MacVLAN networks for each PF interface */ -}}
{{range $i, $pf := .ClusterConfig.PFs}}
{{- if eq $pf.Traffic "east-west"}}
apiVersion: mellanox.com/v1alpha1
kind: MacvlanNetwork
metadata:
  name: {{$.Macvlan.NetworkName}}-rail-{{$pf.Rail}}{{suffix $.ClusterConfig.Identifier}}{{nsSuffix $.NetworkNamespaces $.CurrentNetworkNamespace}}
spec:
  networkNamespace: "{{$.CurrentNetworkNamespace}}"
  master: "{{$pf.NetworkInterface}}"
  mode: "bridge"
  # mtu: 0 → inherit master PF's MTU. The macvlan CNI enforces
  # child.MTU <= master.MTU; pinning an explicit jumbo value here fails
  # container-creation on hosts where the PF is still 1500. Unlike
  # SR-IOV (SriovNetworkNodePolicy.spec.mtu drives the host PF), the
  # rdma_shared / macvlan stack has no operator-driven hook to bump
  # host PF MTU, so inheriting is the only safe default. To run jumbo
  # frames, set the PF MTU on the host out-of-band (systemd-networkd,
  # udev rule, NetworkManager) and pods inherit it automatically.
  mtu: 0
  ipam: |
    {
      "type": "nv-ipam",
      "poolName": "{{$.NvIpam.PoolName}}-rail-{{$pf.Rail}}{{suffix $.ClusterConfig.Identifier}}"
    }
{{- if $metaPlugins }}
  metaPlugins: |
{{ $metaPlugins }}
{{- end }}
{{if ne $i (sub (len $.ClusterConfig.PFs) 1)}}---{{end}}
{{- end}}
{{- end}}
{{else}}
{{/* Create single shared MacVLAN network for all devices */}}
apiVersion: mellanox.com/v1alpha1
kind: MacvlanNetwork
metadata:
  name: {{.Macvlan.NetworkName}}{{suffix $.ClusterConfig.Identifier}}{{nsSuffix $.NetworkNamespaces $.CurrentNetworkNamespace}}
spec:
  networkNamespace: "{{$.CurrentNetworkNamespace}}"
  master: "{{(index .ClusterConfig.PFs 0).NetworkInterface}}"
  mode: "bridge"
  # mtu: 0 → inherit master PF's MTU (see multirail branch above).
  mtu: 0
  ipam: |
    {
      "type": "nv-ipam",
      "poolName": "{{.NvIpam.PoolName}}{{suffix $.ClusterConfig.Identifier}}"
    }
{{- if $metaPlugins }}
  metaPlugins: |
{{ $metaPlugins }}
{{- end }}
{{end}}
