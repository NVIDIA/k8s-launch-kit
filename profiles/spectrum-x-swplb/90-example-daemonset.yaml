# Example multi-rail DaemonSet with Spectrum-X SWPLB networking
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spectrum-x-swplb-test{{suffix .ClusterConfig.Identifier}}
  namespace: {{$.PodNamespace}}
spec:
  selector:
    matchLabels:
      app: spectrum-x-swplb-test{{suffix .ClusterConfig.Identifier}}
  template:
    metadata:
      labels:
        app: spectrum-x-swplb-test{{suffix .ClusterConfig.Identifier}}
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ $first := true }}{{- range $i, $pf := .ClusterConfig.PFs}}{{- if eq $pf.Traffic "east-west"}}{{- range $planeIdx := untilStep 0 $.Profile.SpectrumX.NumberOfPlanes 1}}{{- if not $first}},{{end}}{{- $first = false}}rail-{{$i}}-plane-{{$planeIdx}}{{- end}}{{- end}}{{- end}}
    spec:
      containers:
      - name: spectrum-x-test
        image: nvcr.io/nvidia/mellanox/rping-test:latest
        securityContext:
          capabilities:
            add: ["IPC_LOCK", "NET_RAW"]
        resources:
          requests:
            {{- range $i, $pf := .ClusterConfig.PFs}}
            {{- if eq $pf.Traffic "east-west"}}
            {{- range $planeIdx := untilStep 0 $.Profile.SpectrumX.NumberOfPlanes 1}}
            nvidia.com/rail_{{$i}}_plane_{{$planeIdx}}: "1"
            {{- end }}
            {{- end }}
            {{- end }}
          limits:
            {{- range $i, $pf := .ClusterConfig.PFs}}
            {{- if eq $pf.Traffic "east-west"}}
            {{- range $planeIdx := untilStep 0 $.Profile.SpectrumX.NumberOfPlanes 1}}
            nvidia.com/rail_{{$i}}_plane_{{$planeIdx}}: "1"
            {{- end }}
            {{- end }}
            {{- end }}
        command:
        - sh
        - -c
        - |
          echo "Spectrum-X Multi-Rail SWPLB Test DaemonSet"
          echo "Available network interfaces:"
          ip addr show
          echo ""
          echo "RDMA devices:"
          rdma link
          echo ""
          echo "Sleeping indefinitely for manual testing..."
          sleep infinity
