apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUServiceChain
metadata:
  name: {{ .Names.Tower }}
  namespace: {{ .Namespace }}
spec:
  template:
    spec:
      nodeSelector:
        matchLabels:
          {{ .ScopeKey }}: "{{ .ScopeValue }}"
      template:
        spec:
          switches:
          - serviceMTU: 1500
            ports:
            - serviceInterface:
                matchLabels:
                  {{ .TowerLabel }}: tower-ingress
          - serviceMTU: 1500
            ports:
            - serviceInterface:
                matchLabels:
                  {{ .TowerLabel }}: tower-egress
