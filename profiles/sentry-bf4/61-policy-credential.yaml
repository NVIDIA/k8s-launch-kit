apiVersion: svc.dpu.nvidia.com/v1alpha1
kind: DPUServiceCredentialRequest
metadata:
  name: {{ .Names.Server }}
  namespace: {{ .Namespace }}
spec:
  duration: 24h
  serviceAccount:
    name: {{ .Names.Server }}
    namespace: {{ .Namespace }}
  targetCluster:
    name: {{ .TenantName }}
    namespace: {{ .TenantNamespace }}
  type: kubeconfig
  secret:
    name: {{ .Names.CredentialSecret }}
    namespace: {{ .Namespace }}
