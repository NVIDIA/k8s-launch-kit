apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Names.Server }}
  namespace: {{ .Namespace }}
rules:
  - apiGroups: ["tower.dpu.nvidia.com"]
    resources: ["docatowerpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tower.dpu.nvidia.com"]
    resources: ["docatowerpolicies/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Names.Server }}
  namespace: {{ .Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Names.Server }}
subjects:
  - kind: ServiceAccount
    name: {{ .Names.Server }}
    namespace: {{ .Namespace }}
