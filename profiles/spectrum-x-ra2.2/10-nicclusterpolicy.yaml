apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
spec:
  {{- if .NetworkOperator.ImagePullSecrets }}
  global:
    imagePullSecrets:
    {{- range .NetworkOperator.ImagePullSecrets }}
      - {{ . }}
    {{- end }}
  {{- end }}
  nicConfigurationOperator:
    operator:
      image: nic-configuration-operator
      repository: "{{.NetworkOperator.Repository}}"
      version: "{{.NetworkOperator.ComponentVersion}}"
    configurationDaemon:
      image: nic-configuration-operator-daemon
      repository: "{{.NetworkOperator.Repository}}"
      version: "{{.NetworkOperator.ComponentVersion}}"
    {{- if .NicConfigurationOperator.UpdateFW }}
    nicFirmwareStorage:
      create: true
      pvcName: nic-fw-storage-pvc
      storageClassName: nic-fw-storage-class
      availableStorageSize: 1Gi
    {{- end }}
    logLevel: info
  nvIpam:
    image: nvidia-k8s-ipam
    repository: "{{.NetworkOperator.Repository}}"
    version: "{{.NetworkOperator.ComponentVersion}}"
    enableWebhook: false
  spectrumXOperator:
    image: spectrum-x-operator
    repository: "{{.NetworkOperator.Repository}}"
    version: "{{.NetworkOperator.ComponentVersion}}"
    xPlane:
      image: xplane
      repository: "{{xPlaneRepository .NetworkOperator}}"
      version: "{{xPlaneVersion .NetworkOperator}}"
      {{- if .NetworkOperator.ImagePullSecrets }}
      imagePullSecrets:
      {{- range .NetworkOperator.ImagePullSecrets }}
        - {{ . }}
      {{- end }}
      {{- end }}
  secondaryNetwork:
    cniPlugins:
      image: plugins
      repository: "{{.NetworkOperator.Repository}}"
      version: "{{.NetworkOperator.ComponentVersion}}"
    multus:
      image: multus-cni
      repository: "{{.NetworkOperator.Repository}}"
      version: "{{.NetworkOperator.ComponentVersion}}"
