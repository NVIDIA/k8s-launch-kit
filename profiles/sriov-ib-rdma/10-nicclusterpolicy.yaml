apiVersion: mellanox.com/v1alpha1
kind: NicClusterPolicy
metadata:
  name: nic-cluster-policy
spec:
  {{- if .DOCADriver.Enable }}
  ofedDriver:
    image: doca-driver
    repository: {{.NetworkOperator.Repository}}
    version: {{.DOCADriver.Version}}
    env:
      - name: UNLOAD_STORAGE_MODULES
        value: "{{.DOCADriver.UnloadStorageModules}}"
      - name: ENABLE_NFSRDMA
        value: "{{.DOCADriver.EnableNFSRDMA}}"
      {{- if and .DOCADriver.BlacklistDependentModules .ClusterConfig }}
      {{- if .ClusterConfig.OfedDependentModules }}
      - name: OFED_BLACKLIST_MODULES
        value: "{{joinModules .ClusterConfig.OfedDependentModules}}"
      {{- end }}
      {{- end }}
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: true
        enable: true
        force: true
        timeoutSeconds: 300
      maxParallelUpgrades: 1
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 30
  {{- end }}
  {{- if and .NicConfigurationOperator .NicConfigurationOperator.DeployNicInterfaceNameTemplate }}
  nicConfigurationOperator:
    operator:
      image: nic-configuration-operator
      repository: {{.NetworkOperator.Repository}}
      version: {{.NetworkOperator.ComponentVersion}}
    configurationDaemon:
      image: nic-configuration-operator-daemon
      repository: {{.NetworkOperator.Repository}}
      version: {{.NetworkOperator.ComponentVersion}}
    logLevel: info
  {{- end }}
  nvIpam:
    image: nvidia-k8s-ipam
    repository: {{.NetworkOperator.Repository}}
    version: {{.NetworkOperator.ComponentVersion}}
    imagePullSecrets: []
    enableWebhook: false
  secondaryNetwork:
    cniPlugins:
      image: plugins
      repository: {{.NetworkOperator.Repository}}
      version: {{.NetworkOperator.ComponentVersion}}
    multus:
      image: multus-cni
      repository: {{.NetworkOperator.Repository}}
      version: {{.NetworkOperator.ComponentVersion}}