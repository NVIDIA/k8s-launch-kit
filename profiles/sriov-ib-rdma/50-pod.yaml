{{- if .Profile.Multirail -}}
{{- /* Create single test pod with all SR-IOV IB networks */ -}}
apiVersion: v1
kind: Pod
metadata:
  name: sriov-ib-test-pod{{suffix .ClusterConfig.Identifier}}
  annotations:
    k8s.v1.cni.cncf.io/networks: {{ $first := true }}{{- range $i, $pf := .ClusterConfig.PFs}}{{- if eq $pf.Traffic "east-west"}}{{- if not $first}},{{end}}{{- $first = false}}{{$.Sriov.NetworkName}}-rail-{{$pf.Rail}}{{- end}}{{- end}}
spec:
  {{- if .ClusterConfig.NodeSelector }}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          {{- range $key, $value := .ClusterConfig.NodeSelector }}
          - key: {{ $key }}
            {{- if ne $value "" }}
            operator: In
            values:
            - {{ $value }}
            {{- else }}
            operator: Exists
            {{- end }}
          {{- end }}
  {{- end }}
  containers:
  - name: test-container
    image: mellanox/rping-test
    command: ["/bin/bash", "-c", "sleep infinity"]
    securityContext:
      capabilities:
        add: ["IPC_LOCK"]
    resources:
      requests:
        {{- range $i, $pf := .ClusterConfig.PFs}}
        {{- if eq $pf.Traffic "east-west"}}
        nvidia.com/{{$.Sriov.ResourceName}}_rail_{{$pf.Rail}}: '1'
        {{- end}}
        {{- end}}
      limits:
        {{- range $i, $pf := .ClusterConfig.PFs}}
        {{- if eq $pf.Traffic "east-west"}}
        nvidia.com/{{$.Sriov.ResourceName}}_rail_{{$pf.Rail}}: '1'
        {{- end}}
        {{- end}}
{{- else}}
apiVersion: v1
kind: Pod
metadata:
  name: sriov-ib-test-pod{{suffix $.ClusterConfig.Identifier}}
  annotations:
    k8s.v1.cni.cncf.io/networks: {{.Sriov.NetworkName}}
spec:
  {{- if $.ClusterConfig.NodeSelector }}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          {{- range $key, $value := $.ClusterConfig.NodeSelector }}
          - key: {{ $key }}
            {{- if ne $value "" }}
            operator: In
            values:
            - {{ $value }}
            {{- else }}
            operator: Exists
            {{- end }}
          {{- end }}
  {{- end }}
  containers:
  - name: test-container
    image: mellanox/rping-test
    command: ["/bin/bash", "-c", "sleep infinity"]
    securityContext:
      capabilities:
        add: ["IPC_LOCK"]
    resources:
      requests:
        nvidia.com/{{.Sriov.ResourceName}}: '1'
      limits:
        nvidia.com/{{.Sriov.ResourceName}}: '1'
{{- end}}