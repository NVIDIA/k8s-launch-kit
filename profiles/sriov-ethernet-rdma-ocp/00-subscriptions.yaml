{{- range .OCPOperatorInstall.Operators }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: "{{ .Package }}"
  namespace: "{{ .Namespace }}"
spec:
  channel: "{{ .Channel }}"
  name: "{{ .Package }}"
  source: "{{ .Source }}"
  sourceNamespace: "{{ .SourceNamespace }}"
  installPlanApproval: "{{ .InstallPlanApproval }}"
{{- end }}
