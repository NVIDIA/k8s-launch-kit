{{- range .OCPOperatorInstall.Operators }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: "{{ .Name }}"
  namespace: "{{ .Namespace }}"
  {{- if .RetainOnClean }}
  annotations:
    nvidia.kubernetes-launch-kit.ocp-clean-retain: "true"
  {{- end }}
spec:
  channel: "{{ .Channel }}"
  name: "{{ .Package }}"
  source: "{{ .Source }}"
  sourceNamespace: "{{ .SourceNamespace }}"
  installPlanApproval: "{{ .InstallPlanApproval }}"
{{- end }}
