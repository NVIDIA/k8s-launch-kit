{{- if .Profile.Multirail -}}
{{- /* Create separate SriovNetworkNodePolicy per PF using rootDevices */ -}}
{{- range $i, $pf := .ClusterConfig.PFs}}
{{- if eq $pf.Traffic "east-west"}}
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetworkNodePolicy
metadata:
  name: ethernet-sriov-rail-{{$pf.Rail}}{{suffix $.ClusterConfig.Identifier}}
  namespace: {{$.NetworkOperator.Namespace}}
spec:
  deviceType: netdevice
  mtu: {{$.Sriov.EthernetMtu}}
  {{- if $.ClusterConfig.NodeSelector }}
  nodeSelector:
    {{- range $key, $value := $.ClusterConfig.NodeSelector }}
    {{ $key }}: "{{ $value }}"
    {{- end }}
  {{- end }}
  nicSelector:
    vendor: "15b3"
    rootDevices:
      - "{{$pf.PciAddress}}"
  isRdma: true
  linkType: ETH
  numVfs: {{$.Sriov.NumVfs}}
  priority: {{$.Sriov.Priority}}
  resourceName: {{$.Sriov.ResourceName}}_rail_{{$pf.Rail}}
{{if ne $i (sub (len $.ClusterConfig.PFs) 1)}}---{{end -}}
{{- end -}}
{{- end -}}
{{- else -}}
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetworkNodePolicy
metadata:
  name: ethernet-sriov{{suffix $.ClusterConfig.Identifier}}
  namespace: {{.NetworkOperator.Namespace}}
spec:
  deviceType: netdevice
  mtu: {{.Sriov.EthernetMtu}}
  {{- if $.ClusterConfig.NodeSelector }}
  nodeSelector:
    {{- range $key, $value := $.ClusterConfig.NodeSelector }}
    {{ $key }}: "{{ $value }}"
    {{- end }}
  {{- end }}
  nicSelector:
    vendor: "15b3"
  isRdma: true
  linkType: ETH
  numVfs: {{.Sriov.NumVfs}}
  priority: {{.Sriov.Priority}}
  resourceName: {{.Sriov.ResourceName}}
{{- end}}