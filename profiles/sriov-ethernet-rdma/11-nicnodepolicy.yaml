{{- /* NicNodePolicy was introduced in Network Operator 26.4. For older
       releases (26.1.x), the OFED driver and SR-IOV device plugin sections
       are emitted in NicClusterPolicy (10-nicclusterpolicy.yaml) instead.
       The SR-IOV device plugin policy is a separate CRD rendered by
       40-sriovnetworknodepolicy.yaml, so the only NNP body section in this
       profile is ofedDriver — gated on DOCADriver.Enable to avoid emitting
       a no-op NNP that only carries metadata + nodeSelector. */ -}}
{{- if and (versionGE .NetworkOperator.SelectedRelease "26.4") .DOCADriver.Enable }}
apiVersion: mellanox.com/v1alpha1
kind: NicNodePolicy
metadata:
  name: "{{.ClusterConfig.Identifier | nnpName}}"
spec:
  {{- if .ClusterConfig.NodeSelector }}
  nodeSelector:
    {{- range $k, $v := .ClusterConfig.NodeSelector }}
    {{ $k }}: "{{ $v }}"
    {{- end }}
  {{- end }}
  {{- if .DOCADriver.Enable }}
  ofedDriver:
    image: doca-driver
    repository: "{{.NetworkOperator.Repository}}"
    {{- if .NetworkOperator.ImagePullSecrets }}
    imagePullSecrets:
    {{- range .NetworkOperator.ImagePullSecrets }}
      - {{ . }}
    {{- end }}
    {{- end }}
    version: "{{.DOCADriver.Version}}"
    env:
      - name: UNLOAD_STORAGE_MODULES
        value: "{{.DOCADriver.UnloadStorageModules}}"
      - name: ENABLE_NFSRDMA
        value: "{{.DOCADriver.EnableNFSRDMA}}"
      - name: UNLOAD_THIRD_PARTY_RDMA_MODULES
        value: "{{.DOCADriver.UnloadThirdPartyRDMAModules}}"
      - name: SKIP_PREFLIGHT_CHECKS
        value: "{{.DOCADriver.SkipPreflightChecks}}"
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: true
        enable: true
        force: true
        timeoutSeconds: 300
      maxParallelUpgrades: {{ .Maintenance.MaxParallelUpgrades }}
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 30
  {{- end }}
{{- end }}
