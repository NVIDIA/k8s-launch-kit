{{- if .Profile.Multirail -}}
{{- /* Create DaemonSet with all host device networks */ -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hostdev-test{{boundedSuffix 48 .ClusterConfig.Identifier}}
  namespace: "{{$.CurrentNetworkNamespace}}"
spec:
  selector:
    matchLabels:
      app: hostdev-test{{boundedSuffix 48 .ClusterConfig.Identifier}}
  template:
    metadata:
      labels:
        app: hostdev-test{{boundedSuffix 48 .ClusterConfig.Identifier}}
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ $first := true }}{{- range $i, $pf := .ClusterConfig.PFs}}{{- if eq $pf.Traffic "east-west"}}{{- if not $first}},{{end}}{{- $first = false}}{{$.Hostdev.NetworkName}}-rail-{{$pf.Rail}}{{suffix $.ClusterConfig.Identifier}}{{nsSuffix $.NetworkNamespaces $.CurrentNetworkNamespace}}{{- end}}{{- end}}
    spec:
      {{- if .ClusterConfig.NodeSelector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              {{- if .ClusterConfig.SourceMachineLabels }}
              - key: nvidia.kubernetes-launch-kit.machine
                operator: In
                values:
                {{- range .ClusterConfig.SourceMachineLabels }}
                - "{{ . }}"
                {{- end }}
              {{- else }}
              {{- range $key, $value := .ClusterConfig.NodeSelector }}
              - key: {{ $key }}
                {{- if ne $value "" }}
                operator: In
                values:
                - "{{ printf "%v" $value }}"
                {{- else }}
                operator: Exists
                {{- end }}
              {{- end }}
              {{- end }}
      {{- end }}
      containers:
      - name: test-container
        image: nvcr.io/nvidia/doca/doca:3.3.0-full-rt-host
        command: ["/bin/bash", "-c", "sleep infinity"]
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        resources:
          requests:
            {{- range $i, $pf := .ClusterConfig.PFs}}
            {{- if eq $pf.Traffic "east-west"}}
            nvidia.com/{{$.Hostdev.ResourceName}}_rail_{{$pf.Rail}}: '1'
            {{- end}}
            {{- end}}
          limits:
            {{- range $i, $pf := .ClusterConfig.PFs}}
            {{- if eq $pf.Traffic "east-west"}}
            nvidia.com/{{$.Hostdev.ResourceName}}_rail_{{$pf.Rail}}: '1'
            {{- end}}
            {{- end}}
      - name: netshoot
        image: nicolaka/netshoot:latest
        command: ["/bin/bash", "-c", "trap 'exit 0' TERM INT; while true; do while wait -n 2>/dev/null; do :; done; sleep 1 & wait $! || true; done"]
        securityContext:
          capabilities:
            add: ["NET_RAW"]
{{- else}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hostdev-test{{boundedSuffix 48 .ClusterConfig.Identifier}}
  namespace: "{{$.CurrentNetworkNamespace}}"
spec:
  selector:
    matchLabels:
      app: hostdev-test{{boundedSuffix 48 .ClusterConfig.Identifier}}
  template:
    metadata:
      labels:
        app: hostdev-test{{boundedSuffix 48 .ClusterConfig.Identifier}}
      annotations:
        k8s.v1.cni.cncf.io/networks: {{.Hostdev.NetworkName}}{{suffix $.ClusterConfig.Identifier}}{{nsSuffix $.NetworkNamespaces $.CurrentNetworkNamespace}}
    spec:
      {{- if .ClusterConfig.NodeSelector }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              {{- if .ClusterConfig.SourceMachineLabels }}
              - key: nvidia.kubernetes-launch-kit.machine
                operator: In
                values:
                {{- range .ClusterConfig.SourceMachineLabels }}
                - "{{ . }}"
                {{- end }}
              {{- else }}
              {{- range $key, $value := .ClusterConfig.NodeSelector }}
              - key: {{ $key }}
                {{- if ne $value "" }}
                operator: In
                values:
                - "{{ printf "%v" $value }}"
                {{- else }}
                operator: Exists
                {{- end }}
              {{- end }}
              {{- end }}
      {{- end }}
      containers:
      - name: test-container
        image: nvcr.io/nvidia/doca/doca:3.3.0-full-rt-host
        command: ["/bin/bash", "-c", "sleep infinity"]
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        resources:
          requests:
            nvidia.com/{{.Hostdev.ResourceName}}: '1'
          limits:
            nvidia.com/{{.Hostdev.ResourceName}}: '1'
      - name: netshoot
        image: nicolaka/netshoot:latest
        command: ["/bin/bash", "-c", "trap 'exit 0' TERM INT; while true; do while wait -n 2>/dev/null; do :; done; sleep 1 & wait $! || true; done"]
        securityContext:
          capabilities:
            add: ["NET_RAW"]
{{- end}}
