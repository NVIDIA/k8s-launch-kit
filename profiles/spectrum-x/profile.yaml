name: Spectrum-X Multi-Rail
plugin: network-operator
profileRequirements:
  fabric: ethernet
  deployment: sriov
  spectrumX:
    spcxVersion: "RA2.1"
    multiplaneMode: ["hwplb", "uniplane", "none"]
  multirail: true
nodeCapabilities:
    sriov: true
    rdma: true
description: |
  Spectrum-X profile provides optimized multi-rail networking with OVS hardware offload,
  DOCA acceleration, and advanced NIC firmware configuration for AI workloads.
  Supports hwplb, uniplane, and none multiplane modes with RDMA exclusive mode.
deploymentGuide: spectrum-x.rst
templates:
  - 10-nicclusterpolicy.yaml
  - 30-nicconfigurationtemplate.yaml
  - 35-nicinterfacenametemplate.yaml
  - 40-sriovnetworkpoolconfig.yaml
  - 50-sriovnetworknodepolicy.yaml
  - 70-ovsnetwork.yaml
  - 80-spectrumxrailpoolconfig.yaml
  - 90-example-daemonset.yaml
