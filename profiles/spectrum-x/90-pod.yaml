# Example multi-rail pod with Spectrum-X networking
apiVersion: v1
kind: Pod
metadata:
  name: spectrum-x-multirail-test-pod
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/networks: {{ $first := true }}{{- range $i, $pf := .ClusterConfig.PFs}}{{- if eq $pf.Traffic "east-west"}}{{- if not $first}},{{end}}{{- $first = false}}rail-{{$i}}{{- end}}{{- end}}
spec:
  restartPolicy: OnFailure
  containers:
  - name: spectrum-x-test
    image: nvcr.io/nvidia/mellanox/rping-test:latest
    securityContext:
      capabilities:
        add: ["IPC_LOCK", "NET_RAW"]
    resources:
      requests:
        {{- range $i, $pf := .ClusterConfig.PFs}}
        {{- if eq $pf.Traffic "east-west"}}
        nvidia.com/rail_{{$i}}: "1"
        {{- end }}
        {{- end }}
      limits:
        {{- range $i, $pf := .ClusterConfig.PFs}}
        {{- if eq $pf.Traffic "east-west"}}
        nvidia.com/rail_{{$i}}: "1"
        {{- end }}
        {{- end }}
    command:
    - sh
    - -c
    - |
      echo "Spectrum-X Multi-Rail Test Pod"
      echo "Available network interfaces:"
      ip addr show
      echo ""
      echo "RDMA devices:"
      rdma link
      echo ""
      echo "Sleeping indefinitely for manual testing..."
      sleep infinity
