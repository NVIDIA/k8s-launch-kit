{{- /* NicNodePolicy was introduced in Network Operator 26.4. For older
       releases (26.1.x), the OFED driver and rdmaSharedDevicePlugin sections
       are emitted in NicClusterPolicy (10-nicclusterpolicy.yaml) instead. */ -}}
{{- if versionGE .NetworkOperator.SelectedRelease "26.4" }}
apiVersion: mellanox.com/v1alpha1
kind: NicNodePolicy
metadata:
  name: "{{.ClusterConfig.Identifier | nnpName}}"
spec:
  {{- if .ClusterConfig.NodeSelector }}
  nodeSelector:
    {{- range $k, $v := .ClusterConfig.NodeSelector }}
    {{ $k }}: "{{ $v }}"
    {{- end }}
  {{- end }}
  {{- if .DOCADriver.Enable }}
  ofedDriver:
    image: doca-driver
    repository: "{{.NetworkOperator.Repository}}"
    {{- if .NetworkOperator.ImagePullSecrets }}
    imagePullSecrets:
    {{- range .NetworkOperator.ImagePullSecrets }}
      - {{ . }}
    {{- end }}
    {{- end }}
    version: "{{.DOCADriver.Version}}"
    env:
      - name: UNLOAD_STORAGE_MODULES
        value: "{{.DOCADriver.UnloadStorageModules}}"
      - name: ENABLE_NFSRDMA
        value: "{{.DOCADriver.EnableNFSRDMA}}"
      - name: UNLOAD_THIRD_PARTY_RDMA_MODULES
        value: "{{.DOCADriver.UnloadThirdPartyRDMAModules}}"
      - name: SKIP_PREFLIGHT_CHECKS
        value: "{{.DOCADriver.SkipPreflightChecks}}"
    upgradePolicy:
      autoUpgrade: true
      drain:
        deleteEmptyDir: true
        enable: true
        force: true
        timeoutSeconds: 300
      maxParallelUpgrades: 1
    startupProbe:
      initialDelaySeconds: 10
      periodSeconds: 10
    livenessProbe:
      initialDelaySeconds: 30
      periodSeconds: 30
    readinessProbe:
      initialDelaySeconds: 10
      periodSeconds: 30
  {{- end }}
  rdmaSharedDevicePlugin:
    image: k8s-rdma-shared-dev-plugin
    repository: "{{.NetworkOperator.Repository}}"
    {{- if .NetworkOperator.ImagePullSecrets }}
    imagePullSecrets:
    {{- range .NetworkOperator.ImagePullSecrets }}
      - {{ . }}
    {{- end }}
    {{- end }}
    version: "{{.NetworkOperator.ComponentVersion}}"
    config: |
      {
        "configList": [
        {{- if .Profile.Multirail -}}
        {{/* Create separate RDMA resources for each PF network interface */}}

          {{- range $i, $pf := .ClusterConfig.PFs}}
          {{- if eq $pf.Traffic "east-west"}}
          {
            "resourceName": "{{$.RdmaShared.ResourceName}}_rail_{{$pf.Rail}}{{resourceSuffix $.ClusterConfig.Identifier}}",
            "rdmaHcaMax": {{$.RdmaShared.HcaMax}},
            "selectors": {
              "ifNames": ["{{$pf.NetworkInterface}}"]
            }
          }{{if ne $i (sub (len $.ClusterConfig.PFs) 1)}},{{end}}
          {{- end}}
          {{- end}}

        {{- else}}
          {{- /* Create single RDMA resource with all interfaces */ -}}
          {
            "resourceName": "{{.RdmaShared.ResourceName}}{{resourceSuffix $.ClusterConfig.Identifier}}",
            "rdmaHcaMax": {{.RdmaShared.HcaMax}},
            "selectors": {
              "ifNames": [{{range $i, $pf := .ClusterConfig.PFs}}{{if gt $i 0}}, {{end}}"{{$pf.NetworkInterface}}"{{end}}]
            }
          }
        {{- end}}
        ]
      }
{{- end }}

