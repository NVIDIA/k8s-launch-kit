{{- if eq (spectrumXPlatform .ClusterConfig) "vr" }}
{{- range $rail, $addresses := railPciGroups .ClusterConfig.PFs .Profile.SpectrumX.NumberOfPlanes }}
{{- if $rail }}---
{{ end -}}
apiVersion: configuration.net.nvidia.com/v1alpha1
kind: NicInterfaceNameTemplate
metadata:
  name: nic-rename-for-spectrum-x-r{{$rail}}{{suffix $.ClusterConfig.Identifier}}
  namespace: "{{$.NetworkOperator.Namespace}}"
spec:
  {{- if $.ClusterConfig.NodeSelector }}
  nodeSelector:
    {{- range $key, $value := $.ClusterConfig.NodeSelector }}
    {{ $key }}: "{{ $value }}"
    {{- end }}
  {{- end }}
  rdmaDevicePrefix: "{{spectrumXVRRdmaPrefix $.ClusterConfig $rail}}"
  netDevicePrefix: "{{spectrumXRailPrefix ($.ClusterConfig.SpectrumX.InterfaceNames.NetdevPrefix) $rail}}"
  pfsPerNic: 4
  railPciAddresses: [[{{range $i, $address := $addresses}}{{if $i}}, {{end}}{{printf "%q" $address}}{{end}}]]
{{ end }}
{{- else }}
apiVersion: configuration.net.nvidia.com/v1alpha1
kind: NicInterfaceNameTemplate
metadata:
  name: nic-rename-for-spectrum-x{{suffix .ClusterConfig.Identifier}}
  namespace: "{{.NetworkOperator.Namespace}}"
spec:
  {{- if .ClusterConfig.NodeSelector }}
  nodeSelector:
    {{- range $key, $value := .ClusterConfig.NodeSelector }}
    {{ $key }}: "{{ $value }}"
    {{- end }}
  {{- end }}
  rdmaDevicePrefix: "{{.ClusterConfig.SpectrumX.InterfaceNames.RdmaPrefix}}"
  netDevicePrefix: "{{.ClusterConfig.SpectrumX.InterfaceNames.NetdevPrefix}}"
  pfsPerNic: {{spectrumXPfsPerNic .ClusterConfig.PFs .Profile.SpectrumX.NumberOfPlanes}}
  railPciAddresses: [{{- $first := true }}{{- range $group := railPciGroups .ClusterConfig.PFs .Profile.SpectrumX.NumberOfPlanes }}{{- if not $first }}, {{ end }}{{- $first = false }}[{{- $firstInner := true }}{{- range $addr := $group }}{{- if not $firstInner }}, {{ end }}{{- $firstInner = false }}"{{$addr}}"{{- end }}]{{- end }}]
{{- end }}
