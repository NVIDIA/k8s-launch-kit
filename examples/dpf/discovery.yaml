# Synthetic site. Replace endpoints, kubeconfig and account references locally.
management:
  kubeconfigRef:
    file: ./credentials/management.kubeconfig
  context: management
credentials:
  dpu-reader:
    username: bmc-reader
    passwordRef:
      env: DPU_BMC_PASSWORD
  host-reader:
    username: bmc-reader
    passwordRef:
      env: HOST_BMC_PASSWORD
discovery:
  dpus:
    - bmcEndpoint: https://192.0.2.11
      credentialRef: dpu-reader
  hosts:
    - bmcEndpoint: https://192.0.2.21
      credentialRef: host-reader
  probes:
    mode: inventory
